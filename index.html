<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金融行业 Top10 热点动态</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
            line-height: 1.8;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 50px 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.8em;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        
        .header .date {
            font-size: 1.3em;
            opacity: 0.95;
            font-weight: 300;
        }
        
        .content {
            padding: 50px 40px;
        }
        
        .hot-item {
            margin-bottom: 30px;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-radius: 20px;
            padding: 30px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 6px solid #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }
        
        .hot-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            border-left-color: #764ba2;
        }
        
        .item-header {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        
        .rank {
            min-width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            font-weight: bold;
            margin-right: 20px;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            flex-shrink: 0;
        }
        
        .item-title-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .item-title {
            flex: 1;
            font-size: 1.4em;
            font-weight: 600;
            color: #2c3e50;
            line-height: 1.4;
            padding-right: 15px;
        }
        
        .toggle-icon {
            font-size: 1.5em;
            color: #667eea;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }
        
        .hot-item.collapsed .toggle-icon {
            transform: rotate(-90deg);
        }
        
        .item-body {
            margin-top: 25px;
            max-height: 2000px;
            overflow: hidden;
            transition: max-height 0.5s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 1;
        }
        
        .hot-item.collapsed .item-body {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }
        
        .item-desc {
            color: #5a6c7d;
            line-height: 2;
            font-size: 1.05em;
            padding: 20px;
            background: white;
            border-radius: 12px;
            border-left: 4px solid #e8f0fe;
        }
        
        /* 热点简介分段样式 */
        .item-desc .point {
            display: block;
            margin-bottom: 15px;
            padding-left: 20px;
            position: relative;
        }
        
        .item-desc .point:last-child {
            margin-bottom: 0;
        }
        
        .item-desc .point::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
        }
        
        /* 关键词高亮 */
        .item-desc .highlight {
            color: #667eea;
            font-weight: 600;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            padding: 2px 8px;
            border-radius: 4px;
        }
        
        .item-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 20px;
            margin-top: 20px;
            border-top: 2px solid #f0f2f5;
        }
        
        .item-meta {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .tag {
            display: inline-block;
            padding: 6px 16px;
            background: linear-gradient(135deg, #e8f0fe 0%, #f0f4ff 100%);
            color: #1e3c72;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: 500;
        }
        
        .source-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white !important;
            text-decoration: none;
            border-radius: 25px;
            font-size: 0.95em;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .source-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
            color: white;
        }
        
        .expand-hint {
            text-align: center;
            color: #95a5a6;
            font-size: 0.9em;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-top: 30px;
        }
        
        .footer {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            color: #7f8c8d;
            font-size: 1em;
            border-top: 2px solid #f0f2f5;
        }
        
        .update-time {
            color: #667eea;
            font-weight: 600;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .content {
                padding: 30px 20px;
            }
            
            .header {
                padding: 30px 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .item-header {
                flex-wrap: wrap;
            }
            
            .rank {
                margin-bottom: 0;
            }
            
            .item-title {
                font-size: 1.2em;
            }
            
            .hot-item {
                padding: 25px;
            }
            
            .item-footer {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 金融行业 Top10 热点动态</h1>
            <div class="date">2026年04月20日</div>
        </div>
        
        <div class="content">
            
            <div class="hot-item">
                <div class="item-header">
                    <div class="rank">1</div>
                    <div class="item-title-wrapper">
                        <div class="item-title">暂无热点数据</div>
                        <div class="toggle-icon">▼</div>
                    </div>
                </div>
                <div class="item-body">
                    <div class="item-desc">
                        <span class="point">请稍后再试</span>
                    </div>
                    <div class="item-footer">
                        <div class="item-meta">
                            <span class="tag">金融热点</span>
                        </div>
                        <a href="https://www.baidu.com" target="_blank" rel="noopener noreferrer" class="source-link">
                            查看详情 →
                        </a>
                    </div>
                </div>
            </div>

            
            <div class="expand-hint">
                💡 点击标题可展开/收起详细内容
            </div>
        </div>
        
        <div class="footer">
            <p>自动生成报告 | <span class="update-time">更新时间：2026-04-20 09:02:03</span></p>
            <p style="margin-top: 10px; opacity: 0.8;">数据来源：全球主流财经媒体 | AI 智能筛选与整理</p>
        </div>
    </div>
    
    <script>
        // 展开/收起功能
        document.querySelectorAll('.item-header').forEach(header => {
            header.addEventListener('click', function() {
                const item = this.closest('.hot-item');
                item.classList.toggle('collapsed');
            });
        });
    </script>
</body>
</html>
